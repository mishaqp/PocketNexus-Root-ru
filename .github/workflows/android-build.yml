name: Android Debug Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Publish unit test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          reports = list(Path("app/build/test-results").rglob("TEST-*.xml"))
          if not reports:
              print("::error title=Unit test reports::No JUnit XML reports were produced.")
          for report in reports:
              root = ElementTree.parse(report).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure") or case.find("error")
                  if failure is None:
                      continue
                  suite = case.get("classname", report.stem)
                  name = case.get("name", "unknown")
                  detail = " ".join((failure.text or failure.get("message", "Test failed")).split())
                  print(f"::error title={suite}.{name}::{detail[:1500]}")
          PY

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
